# Final cost J (task spec B.3; proposal v1.2 s.3.1).  FROZEN before any experiment (L1).
# heurbridge/eval/cost.py holds the same values; tests/test_configs.py keeps them identical.
version: cost_v3_2026-09-29   # v3: Track-B timing gates referenced to the same-path replay (user decision 2026-09-29);
                              # v2: gate enforcement by fidelity (2026-09-28); weights and J normalization unchanged
weights:          # J = sum_k w_k * y_k / y_k^base
  rwl: 0.30       # routed wirelength (detailed route; GR wirelength at f1)
  via: 0.05       # via count
  of: 0.15        # (1 + GR overflow)
  tns: 0.30       # (1 - setup TNS), TNS <= 0 in ns
  power: 0.20     # total power, W
baseline: median over 3 seeds of the tool-native flow, per design
gates:
  setup_wns_guard_ns: 0.02     # cand >= base - 0.02 and base >= 0 => cand >= 0
  hold_wns_guard_ns: 0.02
  drc: 0
  lvs: clean when checked (required at f3)
gate_reference:                # what the setup/hold WNS gates compare with (J is always normalized to `baseline`)
  track_b: median over the tool-native macro layout run through the candidates' path (replay + one-site shifts), per fidelity
  track_a: none (no timing)
gate_enforcement:              # a failing *enforced* gate sets J_inf = +inf; the others are reported only
  f0: [flow]                   # f0/f1: timing and DRC reported, not enforced (f1 timing predicts f2 badly)
  f1: [flow]
  f2: all
  f3: all
failures: J_inf = +inf; every failure recorded by name
